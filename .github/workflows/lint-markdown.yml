name: Lint markdown

# Valida o Markdown de notes/ contra as regras em .markdownlint-cli2.jsonc.
# Roda via npx: nenhuma dependência fica instalada no repositório.

on:
  pull_request:
    paths:
      - "notes/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "*.md"
      - ".markdownlint-cli2.jsonc"
  workflow_dispatch:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rodar markdownlint-cli2
        run: npx --yes markdownlint-cli2
